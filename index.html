<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crowd Text</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    min-height: 100vh;
    padding: 2rem;
    background: #0b0b0d;
    color: #e8e8ea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }

  #hover-text {
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    opacity: 0; /* JS drives this value from the live visitor count */
    transition: opacity 0.35s ease;
    cursor: default;
    user-select: none;
  }

  .meta {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    font-size: 0.95rem;
    color: #8a8a92;
  }

  .meta strong {
    color: #e8e8ea;
    font-weight: 600;
  }

  #status {
    font-size: 0.8rem;
    color: #5c5c63;
  }

  .hint {
    max-width: 32ch;
    font-size: 0.8rem;
    color: #4a4a50;
    line-height: 1.5;
  }
</style>
</head>
<body>

  <div id="hover-text">we are here together</div>

  <div class="meta">
    <div><strong id="visitor-count">0</strong> people here right now</div>
    <div id="status">Connecting…</div>
  </div>

  <div class="hint">
    Text opacity rises 10% per visitor currently on this page (capped at 100%).
    Hover the text to see it at full opacity regardless of the count.
  </div>

<script>
  // ---- Configuration -------------------------------------------------
  // Point this at your deployed backend's WebSocket URL.
  // Example: 'wss://your-app-name.onrender.com'
  const WS_URL = 'wss://personal-bubble.onrender.com';
  // ---------------------------------------------------------------------

  const textEl = document.getElementById('hover-text');
  const countEl = document.getElementById('visitor-count');
  const statusEl = document.getElementById('status');

  let currentCount = 0;
  let hovering = false;
  let reconnectDelay = 1000;
  let socket;

  function ambientOpacityPercent(count) {
    return Math.min(count * 10, 100);
  }

  function applyOpacity() {
    const percent = hovering ? 100 : ambientOpacityPercent(currentCount);
    textEl.style.opacity = percent / 100;
  }

  function connect() {
    statusEl.textContent = 'Connecting…';
    socket = new WebSocket(WS_URL);

    socket.addEventListener('open', () => {
      statusEl.textContent = 'Live';
      reconnectDelay = 1000;
    });

    socket.addEventListener('message', (event) => {
      let data;
      try {
        data = JSON.parse(event.data);
      } catch (err) {
        return;
      }
      if (data.type === 'count') {
        currentCount = data.count;
        countEl.textContent = currentCount;
        applyOpacity();
      }
    });

    socket.addEventListener('close', () => {
      statusEl.textContent = 'Reconnecting… (a free backend can take ~1 min to wake up)';
      setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 1.5, 15000);
    });

    socket.addEventListener('error', () => {
      socket.close();
    });
  }

  textEl.addEventListener('mouseenter', () => {
    hovering = true;
    applyOpacity();
  });
  textEl.addEventListener('mouseleave', () => {
    hovering = false;
    applyOpacity();
  });

  connect();
</script>
</body>
</html>
