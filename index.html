<body>
<div>
<span class="ctx" id="hover-text"><a href="/context/attention.html">attention</a></span>
<span class="ctx" id="hover-text"><a href="/context/seg-01.html">where the eyes rest</a></span>
<span class="ctx" id="hover-text"><a href="/context/seg-02.html">where attention gathers</a></span>
<span class="ctx" id="hover-text"><a href="/context/seg-03.html">where questions lingers</a></span>
<span class="ctx" id="hover-text"><a href="/context/seg-04.html">where the hand reaches</a></span>
<span class="ctx" id="hover-text"><a href="/context/seg-05.html">where the body learns</a></span>
<span class="ctx" id="hover-text"><a href="/context/seg-06.html">where we meet</a></span>
<span class="ctx" id="hover-text"><a href="/context/seg-07.html">where the system watches</a></span>
<span class="ctx" id="hover-text"><a href="/context/seg-08.html">where the gesture returns</a></span>
<span class="ctx" id="hover-text"><a href="/context/seg-09.html">where things move together</a></span>
<span class="ctx" id="hover-text"><a href="/context/seg-10.html">where intention loosens</a></span>
<span class="ctx" id="hover-text"><a href="/context/seg-11.html">where I change things</a></span>
<span class="ctx" id="hover-text"><a href="/context/seg-12.html">where I lose the answer</a></span>
</div>

<script>
let zTop = 100;

document.addEventListener('click', e => {
    const link = e.target.closest('.ctx a');
    if (!link) return;
    e.preventDefault();                 // without JS the link still just navigates
    openPopup(link.href, link.textContent);
});

function openPopup(url, title) {
    const p = document.createElement('div');
    p.className = 'popup';
    p.innerHTML = `
        <div class="popup-bar">
            <span class="popup-title"></span>
            <button class="popup-close" aria-label="Close">&times;</button>
        </div>
        <iframe title="context"></iframe>`;
        const label = p.querySelector('.popup-title');
        const frame = p.querySelector('iframe');

        label.textContent = title;              // link text, shown until the page loads
        frame.addEventListener('load', () => {
            try {                               // contentDocument throws if cross-origin
                label.textContent = frame.contentDocument.title || title;
            } catch {}                          // keep the fallback
        });
        frame.src = url;                        // set src last, after the listener is attached
    p.querySelector('.popup-close').onclick = () => p.remove();

    document.body.appendChild(p);
    placeRandomly(p);
    bringToFront(p);
    makeDraggable(p);
}

/* random spot, fully on screen */
function placeRandomly(p) {
    const pad = 12;
    const { width, height } = p.getBoundingClientRect();
    const maxX = Math.max(pad, innerWidth  - width  - pad);
    const maxY = Math.max(pad, innerHeight - height - pad);
    p.style.left = pad + Math.random() * (maxX - pad) + 'px';
    p.style.top  = pad + Math.random() * (maxY - pad) + 'px';
}

function bringToFront(p) { p.style.zIndex = ++zTop; }

function makeDraggable(p) {
    const bar = p.querySelector('.popup-bar');

    p.addEventListener('pointerdown', () => bringToFront(p));

    bar.addEventListener('pointerdown', e => {
        if (e.target.closest('.popup-close')) return;
        const box = p.getBoundingClientRect();
        const dx = e.clientX - box.left;
        const dy = e.clientY - box.top;

        bar.setPointerCapture(e.pointerId);   // keeps events coming even over the iframe
        p.classList.add('dragging');
        bar.classList.add('dragging');

        const move = ev => {
            const x = clamp(ev.clientX - dx, 0, innerWidth  - box.width);
            const y = clamp(ev.clientY - dy, 0, innerHeight - box.height);
            p.style.left = x + 'px';
            p.style.top  = y + 'px';
        };
        const up = () => {
            bar.removeEventListener('pointermove', move);
            bar.removeEventListener('pointerup', up);
            p.classList.remove('dragging');
            bar.classList.remove('dragging');
        };
        bar.addEventListener('pointermove', move);
        bar.addEventListener('pointerup', up);
    });
}

const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

// ---- Configuration ---------------------------------------------
const WS_URL = 'wss://personal-bubble.onrender.com';
// ------------------------------------------------------------------

function getSessionId() {
    let id = sessionStorage.getItem('presenceSessionId');
    if (!id) {
        id = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`);
        sessionStorage.setItem('presenceSessionId', id);
    }
    return id;
}

let reconnectDelay = 1000;
let socket;

function ambientOpacityPercent(count) {
    return Math.min(Math.max(count - 1, 0) * 10, 100);
}

function setAmbientOpacity(count) {
    const percent = ambientOpacityPercent(count);
    document.documentElement.style.setProperty('--ambient-opacity', percent / 100);
}

function connectPresence() {
    socket = new WebSocket(`${WS_URL}?sid=${encodeURIComponent(getSessionId())}`);

    socket.addEventListener('open', () => {
        reconnectDelay = 1000;
    });

    socket.addEventListener('message', (event) => {
        let data;
        try {
            data = JSON.parse(event.data);
        } catch (err) {
            return;
        }
        if (data.type === 'count') {
            setAmbientOpacity(data.count);
        }
    });

    socket.addEventListener('close', () => {
        setTimeout(connectPresence, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 1.5, 15000);
    });

    socket.addEventListener('error', () => {
        socket.close();
    });
}

connectPresence();

</script>
</body>
