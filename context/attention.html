<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>we are here together</title>
<link rel="stylesheet" href="/styling/context.css">
</head>
<body>
<p> Opacity rises per visitor currently on this page.
    Hover around and enjoy while you're still here. </p>
    <div class="caption" id="caption">–</div>
    <div id="status">connecting…</div>

<script>
    // ---- Configuration ---------------------------------------------
    // Same backend used by the rest of the site. Replace with your
    // actual Render service URL (wss://, not https://).
    const WS_URL = 'wss://YOUR-RENDER-APP-NAME.onrender.com';
    // ------------------------------------------------------------------

    const captionEl = document.getElementById('caption');
    const statusEl = document.getElementById('status');

    // One random ID per browser tab, shared with index.html via
    // sessionStorage (this page runs same-origin, usually inside an
    // iframe popup opened from index.html). Sharing the ID lets the
    // server treat a tab plus its own popup(s) as a single visitor.
    function getSessionId() {
        let id = sessionStorage.getItem('presenceSessionId');
        if (!id) {
            id = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`);
            sessionStorage.setItem('presenceSessionId', id);
        }
        return id;
    }

    let reconnectDelay = 1000;
    let socket;

    function caption(count) {
        if (count <= 1) return 'you are the only one here';
        if (count === 2) return 'one other person is here with you';
        return 'others are here with you';
    }

    function connect() {
        statusEl.textContent = 'connecting…';
        socket = new WebSocket(`${WS_URL}?sid=${encodeURIComponent(getSessionId())}`);

        socket.addEventListener('open', () => {
            statusEl.textContent = '';
            reconnectDelay = 1000;
        });

        socket.addEventListener('message', (event) => {
            let data;
            try {
                data = JSON.parse(event.data);
            } catch (err) {
                return;
            }
            if (data.type === 'count') {
                captionEl.textContent = caption(data.count);
            }
        });

        socket.addEventListener('close', () => {
            statusEl.textContent = 'reconnecting… (this can take about a minute if the site has been quiet)';
            setTimeout(connect, reconnectDelay);
            reconnectDelay = Math.min(reconnectDelay * 1.5, 15000);
        });

        socket.addEventListener('error', () => {
            socket.close();
        });
    }

    connect();
</script>
</body>
</html>
