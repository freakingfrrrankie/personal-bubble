The prototype can tell me that a body became <strong>1</strong>.
<br>
It can tell me that <strong>1</strong> crossed a threshold.
It can make that threshold audible.
But it cannot tell me what it feels like when the room moves closer.
<br><br>That knowledge remains with the bodies that have not yet entered it.
