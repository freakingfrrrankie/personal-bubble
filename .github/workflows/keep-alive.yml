name: Keep Render backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the backend
        run: |
          curl -sS -o /dev/null -w "status: %{http_code}\n" https://personal-bubble.onrender.com || true
